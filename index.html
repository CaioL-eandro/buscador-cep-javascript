<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Cep</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>BUSCADOR DE CEP </h1>
    </header>
   <main id="container-geral">
      <form id="form-consulta">
        <h2>CONSULTAR CEP</h2>
      <label for="input-cep">Digite o CEP</label>
      <input type="text" name="cep" id="input-cep" maxlength="9" inputmode="numeric" placeholder="00000-000" required>
      <button id="botao-buscar" type="submit">Buscar</button>
      <button id="botao-limpar" type="button">Limpar</button>
      <p id="mensagem-status" role="status" aria-live="polite"></p>
      </form>
      <section id="card-informacoes">
        <h2>INFORMAÇÕES DO ENDEREÇO</h2>
        <p>CEP: <span id="span-cep"></span></p>
            <p>Logradouro :<span id="span-logradouro"></span></p>
            <p>Bairro: <span id="span-bairro"></span></p>
            <p>Cidade: <span id="span-cidade"></span></p>
            <p>Estado: <span id="span-estado"></span></p>
      </section>
   </main>
   <script src="script.js"></script>
</body>
</html>

<!-- 1. Funcionalidades que vamos implementar
Nº	Funcionalidade	Descrição
F01	Informar CEP	Campo para digitar um CEP brasileiro
F02	Validar CEP	Aceitar somente 8 dígitos numéricos, com ou sem hífen
F03	Consultar API	Buscar o endereço utilizando fetch()
F04	Exibir endereço	Mostrar logradouro, bairro, cidade, estado e CEP
F05	CEP inexistente	Informar quando o CEP não for encontrado
F06	Tratar erros	Exibir mensagem quando ocorrer falha de conexão ou resposta inválida
F07	Indicador de carregamento	Mostrar "Buscando endereço..." durante a consulta
F08	Limpar resultado	Permitir limpar a pesquisa e os dados exibidos
F09	Nova consulta	Permitir pesquisar outro CEP sem recarregar a página
F10	Interface responsiva	Adaptar a aplicação para celular e computador
2. Regras de negócio
Essas são as regras que nosso JavaScript deverá respeitar:
- RN01: o CEP é obrigatório.
- RN02: após remover o hífen, o CEP deve possuir exatamente 8 dígitos numéricos.
- RN03: não realizar requisição à API quando o CEP for inválido.
- RN04: mostrar os dados somente quando a consulta retornar um endereço válido.
- RN05: apresentar uma mensagem amigável quando o CEP não existir.
- RN06: não manter resultados antigos na tela após uma consulta malsucedida.
- RN07: impedir consultas duplicadas enquanto uma pesquisa estiver em andamento.
